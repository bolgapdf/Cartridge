name: Cartridge

options:
  bundleIdPrefix: me.jacobsilva
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: H8K99MLMCA
    CODE_SIGN_STYLE: Automatic

targets:
  Cartridge:
    # One source tree, two platforms. Neither kit imports a UI framework, so
    # only the shell differs between iOS and macOS.
    type: application
    platform: [iOS, macOS]
    sources:
      - path: EmulatorKit
      - path: GameBoyKit
      - path: Cartridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.jacobsilva.Cartridge
        PRODUCT_NAME: Cartridge
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Cartridge
        ENABLE_PREVIEWS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

        # Per-platform settings go through Xcode's own `[sdk=...]` conditions.
        # `settings_iOS:` / `settings_macOS:` are not XcodeGen keys — they sat
        # here being silently ignored, which left the iOS app with no launch
        # screen. An iOS app without one runs in compatibility mode: letterboxed
        # into a smaller logical screen with dead black bands above and below
        # everything. It looks exactly like a SwiftUI layout bug, and no amount
        # of changing the layout fixes it.
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        # iPad has to offer all four orientations or it can't be used alongside
        # another app. iPhone leaves out upside-down, as every iPhone app does.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY[sdk=iphone*]: "1,2"
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: true
      configs:
        Debug:
          # The core is a tight interpreter loop. An unoptimised debug build
          # runs roughly an order of magnitude too slowly to play.
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          # And `-O` alone isn't enough. Debug compiles a file at a time, so
          # nothing inlines across the CPU, the bus and the PPU — which is
          # every hot call there is, since one instruction crosses all three.
          # Measured on a real game: 33% of a core per file, 8% whole-module.
          SWIFT_COMPILATION_MODE: wholemodule

  GameBoyKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: EmulatorKit
      - path: GameBoyKit
      - path: GameBoyKitTests
        excludes: ["Resources"]
      # Copied as folder references so the runner can enumerate them.
      - path: GameBoyKitTests/Resources/sm83
        type: folder
        buildPhase: resources
      - path: GameBoyKitTests/Resources/roms
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.jacobsilva.GameBoyKitTests
        GENERATE_INFOPLIST_FILE: true
      configs:
        Debug:
          # The ROM tests run tens of millions of instructions. Unoptimised,
          # they take minutes; optimised, seconds.
          SWIFT_OPTIMIZATION_LEVEL: "-O"

schemes:
  Cartridge_macOS:
    build:
      targets: { Cartridge_macOS: all }
    run: { config: Debug }
    test:
      config: Debug
      targets: [GameBoyKitTests]
  Cartridge_iOS:
    build:
      targets: { Cartridge_iOS: all }
    run: { config: Debug }
    test:
      config: Debug
      targets: [GameBoyKitTests]
